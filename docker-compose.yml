services:
  database:
    image: mysql:8.0
    container_name: starter_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jwt_auth_service
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - starter_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starter_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "5001:5000"
    depends_on:
      - database
    volumes:
      - ./uploads:/app/uploads
    networks:
      - starter_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:5001/api
    container_name: starter_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - starter_network

volumes:
  mysql_data:

networks:
  starter_network:
    driver: bridge
